/* ---------- palettes ---------- */
const PALS = {
  clay:    { l:'#f28a60', m:'#dc6e46', d:'#9b4428' },
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
let RC = [0, 0], RCZ = 0;
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
function setCam(yaw, pitch){ YAW = yaw; PITCH = Math.max(6, Math.min(78, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
const depthOf = p => camDot(p, CAM_V);
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords, mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];
const PY = y => ([u,v]) => [u,y,v];
const PZ = z => ([u,v]) => [u,v,z];
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };
const facing = vis;
const SHADOW_K = 0.85, SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);
const SOFT = .18;
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// text lying flat on a horizontal surface z = const, reading along -y (left to right on screen at the default view)
const txZ = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(1,0,0))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);

const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
function tag(p3, dx, dy, text, on=false){

  return `<g class="tag${on ? ' on' : ''}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ============================================================
   Agent Bench engine (on top of the Colorfigures drawing layer in core.js)

   One body for every agent, modelled after the pixel sprites: a wide block on eight stubby legs, two block arms,
   two pixel eyes. Here the block is a real machine you can open:
     frame   legs + floor (always there)
     shell   FACE (eyes shine through it), BACK, SIDEL (+y, viewer-left, has the PWR and MCP ports), SIDER
     HEAD    the top block: lifts off; the hat sits on it
     inside  BRD main board on four standoffs, U1 LLM core, M1/M2 context RAM, BAT power cell, PWR jack, J1 MCP port,
             SK1-SK3 skill cards in slots, EYE led matrix on a bracket behind the face plate
     arms    ARML / ARMR, the tool sits in one hand
   Local coords (one agent): x = depth 0..40 (front face at x = 40), y = width 0..64 (+y = viewer-left), z = up,
   ground z = 0. The bench mat is 3 thick, so the main agent is drawn with XF.z = 3.
   ============================================================ */

const Z0 = 3;
const MAT = [-12, -42, 74, 120];
const PCB  = { l:'#6cb894', m:'#4f9a76', d:'#255540' };
const RAMC = { l:'#5d8fcf', m:'#4673b0', d:'#1e3354' };
const RED  = { l:'#ec5a49', m:'#c94436', d:'#6b2219' };
const BROWN= { l:'#8a7464', m:'#6f5d50', d:'#3f342c' };
const HOT  = '#ffc94d', GLOW = '#8af0ae';
const CARD_PALS = ['mustard', 'blush', 'cobalt'];
const DEF_YAW = 20, DEF_PITCH = 24;

/* ---------- transform: every helper below goes through X ---------- */
let XF = { s:1, x:0, y:0, z:Z0 };
const X  = (x,y,z) => [XF.x + x*XF.s, XF.y + y*XF.s, XF.z + z*XF.s];
const BX = (x0,y0,z0,x1,y1,z1) => [X(x0,y0,z0), X(x1,y1,z1)];
const bx = (x0,y0,z0,x1,y1,z1,m,shade=tone,w=.9) => { const [a,b] = BX(x0,y0,z0,x1,y1,z1); return box(a[0],a[1],a[2],b[0],b[1],b[2],m,shade,w); };
const wrapId = (svg, id) => id ? `<g data-id="${id}"${id === ST.sel ? ' class="selp"' : ''}>${svg}</g>` : svg;
const it = (bb, svg, id) => ({ box:bb, svg:wrapId(svg, id) });
const ib = (x0,y0,z0,x1,y1,z1,m,shade=tone,w=.9,id) => it(BX(x0,y0,z0,x1,y1,z1), bx(x0,y0,z0,x1,y1,z1,m,shade,w), id);
const cy  = (x,y,z0,z1,r,m,shade=toneI,w=1.1,n=20) => { const a = X(x,y,z0); return cyl(a[0],a[1],a[2],a[2]+(z1-z0)*XF.s, r*XF.s, m, shade, w, n); };
const cyX = (x0,x1,y,z,r,m,shade=toneI,w=1) => { const a = X(x0,y,z), b = X(x1,y,z); return cylX(a[0], b[0], a[1], a[2], r*XF.s, m, shade, w); };
const rd  = (a,b,r,m,shade=toneI,w=1,r1=r) => rod(X(...a), X(...b), r*XF.s, m, shade, w, r1*XF.s);
const pdX = (pts, close=true) => pd(pts.map(p => X(...p)), close);
const shp = (pts, c, w=.9) => fill(pdX(pts), c) + (w ? ink(pdX(pts), w) : '');
const txF = (x,y,z,s,size,col=INK,wt=700) => { const a = X(x,y,z); return tx(a[0],a[1],a[2],s,size*XF.s,col,wt); };
const txS = (x,y,z,s,size,col=INK,wt=700) => { const a = X(x,y,z); return txY(a[0],a[1],a[2],s,size*XF.s,col,wt); };
const txT = (x,y,z,s,size,col=INK,wt=700) => { const a = X(x,y,z); return txZ(a[0],a[1],a[2],s,size*XF.s,col,wt); };
// a box whose inward face (seen when the shell is open) is darker
function wallBox(x0,y0,z0,x1,y1,z1,m,inward,w=1.4){
  const sh = (n, mm) => (n[0] === inward[0] && n[1] === inward[1] && n[2] === inward[2]) ? mix(tone(n, mm), '#000000', .22) : tone(n, mm);
  return bx(x0,y0,z0,x1,y1,z1,m,sh,w);
}
// a parallelepiped o + a*u + b*v + c*w (a laptop lid, a tilted plate)
function para(o,u,v,w,m,shade=toneI,wd=.9){
  const Q = (a,b,c) => [o[0]+a*u[0]+b*v[0]+c*w[0], o[1]+a*u[1]+b*v[1]+c*w[1], o[2]+a*u[2]+b*v[2]+c*w[2]];
  const cen = Q(.5,.5,.5), F = [
    [Q(0,0,0),Q(1,0,0),Q(1,1,0),Q(0,1,0)], [Q(0,0,1),Q(1,0,1),Q(1,1,1),Q(0,1,1)],
    [Q(0,0,0),Q(1,0,0),Q(1,0,1),Q(0,0,1)], [Q(0,1,0),Q(1,1,0),Q(1,1,1),Q(0,1,1)],
    [Q(0,0,0),Q(0,1,0),Q(0,1,1),Q(0,0,1)], [Q(1,0,0),Q(1,1,0),Q(1,1,1),Q(1,0,1)] ];
  return F.map(q => { let n = norm(cross(sub(q[1],q[0]), sub(q[3],q[0]))); if (dot(n, sub(avg(q), cen)) < 0) n = n.map(k => -k);
    return vis(n) ? shape(q.map(p => X(...p)), shade(n, m), wd) : ''; }).join('');
}
const paraN = (o,u,v,w) => { const n = norm(cross(u,v)); return dot(n,w) > 0 ? n.map(k => -k) : n; };   // normal of the c = 0 face
function tube(pts, col, w=2.2){ const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${(w+1.8).toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w.toFixed(2)}" stroke-linecap="round" stroke-linejoin="round"/>`; }
const segItems = (pts, col, w) => pts.slice(1).map((p, i) => { const a = pts[i];
  return { box:[[Math.min(a[0],p[0]),Math.min(a[1],p[1]),Math.min(a[2],p[2])],[Math.max(a[0],p[0]),Math.max(a[1],p[1]),Math.max(a[2],p[2])]], svg:tube([a,p], col, w) }; });
const glow = (p, col, r=3, op=.55) => { const [x,y] = P(...p); return `<circle cx="${f(x)}" cy="${f(y)}" r="${f(r*2.2)}" fill="${col}" opacity="${(op*.35).toFixed(2)}"/><circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${col}" opacity="${op.toFixed(2)}"/>`; };

/* ---------- eyes: pixel shapes in (s = screen right, v = up) around each eye centre ---------- */
const EYE_Y = [51.5, 12.5], EYE_Z = 41.5;
const RQ = (s0,v0,s1,v1) => [[s0,v0],[s1,v0],[s1,v1],[s0,v1]];
const mirS = poly => poly.map(([s,v]) => [-s,v]).reverse();
function eyeShapes(expr){
  const open = RQ(-4.8,-5.2,4.8,5.2), shut = RQ(-5.6,-2.6,5.6,-.2);
  const gt = [[-4,5],[4.5,1.4],[4.5,-1.4],[-4,-5],[-4,-2.2],[1,0],[-4,2.2]];
  const hap = [[-5.5,-3],[0,3.6],[5.5,-3],[2.8,-3],[0,.4],[-2.8,-3]];
  const brow = [[-4.6,5.4],[4.6,4.2],[4.6,5.8],[-4.6,7]], foc = RQ(-3.6,-5,3.6,2.8);
  const xa = [[-5,-3.6],[-3.6,-5],[5,3.6],[3.6,5]];
  switch (expr){
    case 'closed': return [[shut],[shut]];
    case 'happy':  return [[hap],[hap]];
    case 'gt':     return [[gt],[mirS(gt)]];
    case 'wink':   return [[open],[RQ(-5,-1.6,4,.6)]];
    case 'focus':  return [[foc, brow],[foc, mirS(brow)]];
    case 'x':      return [[xa, mirS(xa)],[xa, mirS(xa)]];
    default:       return [[open],[open]];
  }
}
// eyes drawn on the plane x = xf (front side of the face plate, or the LED matrix)
function eyesAt(xf, expr, col){
  if (!vis([1,0,0])) return '';
  return eyeShapes(expr).map((polys, i) => polys.map(poly => fill(pdX(poly.map(([s,v]) => [xf, EYE_Y[i] - s, EYE_Z + v])), col)).join('')).join('');
}

/* ---------- parts ---------- */
const PART_INFO = {
  BRD:{n:'Main board', what:'The motherboard. Everything inside plugs into it, so it goes in first and comes out last.'},
  U1:{n:'LLM core', what:'The model. Which one is set by the model: line of the agent file.'},
  M1:{n:'Context RAM A', what:'Working memory: everything the agent can see at once. Every subagent gets its own.'},
  M2:{n:'Context RAM B', what:'The second stick. With one stick the context fills twice as fast.'},
  BAT:{n:'Power cell', what:'Holds the charge from the cable. No cell, no power.'},
  PWR:{n:'Power jack', what:'Where the cable goes in, through the left panel.'},
  J1:{n:'MCP port', what:'Links this agent to other agents and tools. Plug a cable in here to hand work over.'},
  SK1:{n:'Skill card 1', what:''}, SK2:{n:'Skill card 2', what:''}, SK3:{n:'Skill card 3', what:''},
  EYE:{n:'Eye matrix', what:'The LED face. It shines through the face plate and shows what the agent is doing.'},
  ARMR:{n:'Right arm', what:'Servo arm. Holds the tool.'}, ARML:{n:'Left arm', what:'Servo arm.'},
  SIDER:{n:'Right panel', what:'Shell panel.'}, SIDEL:{n:'Left panel', what:'Shell panel with the PWR and MCP ports.'},
  BACK:{n:'Back panel', what:'Shell panel.'}, FACE:{n:'Face plate', what:'The face. The eyes shine through it.'},
  HEAD:{n:'Head', what:'Lifts off so you can reach the board. Sits on the four panels.'},
};
const HAT_INFO = { captain:['Captain cap','Command hat. The badge does nothing.'], deerstalker:['Deerstalker','Detective hat, two flaps and a bow on top.'],
  chef:['Chef hat','For cooking drafts.'], hardhat:['Hard hat','With a lamp, for looking into server rooms.'], headphones:['Headphones','With a mic boom, for long calls.'] };
const TOOL_INFO = { magnifier:['Magnifier','For reading the small print in templates.','ARMR'], launchbox:['Launch button','The red button. Only works with the LAUNCH card in.','ARMR'],
  pan:['Pan','Something is always sizzling in it.','ARMR'], mug:['Mug','Coffee. Steams while the agent is on.','ARML'] };
const PROP_INFO = { chess:'CHESSBOARD', rocket:'ROCKET', laptop:'LAPTOP', control:'CONTROL BOX', bell:'SERVICE BELL' };
const INNER = ['BRD','U1','M1','M2','BAT','PWR','J1','SK1','SK2','SK3','EYE'];
const ON_BOARD = ['U1','M1','M2','BAT','PWR','J1','SK1','SK2','SK3'];
const WIRED = ['U1','M1','M2','BAT','PWR','J1','SK1','SK2','SK3','EYE','ARMR','ARML'];
const SHELL = ['SIDER','SIDEL','BACK','FACE'];
const ORDER = ['BRD','U1','M1','M2','BAT','PWR','J1','SK1','SK2','SK3','EYE','ARMR','ARML','SIDER','SIDEL','BACK','FACE','HEAD','HAT','TOOL'];
const partsOf = a => ORDER.filter(id => (id !== 'HAT' || a.hat) && (id !== 'TOOL' || a.tool));
const partName = (a, id) => id === 'HAT' ? HAT_INFO[a.hat][0] : id === 'TOOL' ? TOOL_INFO[a.tool][0] : /^SK/.test(id) ? 'Skill card ' + a.cards[+id[2]-1].k : PART_INFO[id].n;
const partWhat = (a, id) => { if (id === 'HAT') return HAT_INFO[a.hat][1]; if (id === 'TOOL') return TOOL_INFO[a.tool][1];
  if (/^SK/.test(id)){ const c = a.cards[+id[2]-1]; return `${c.k} stands for the ${c.tool} tool: it ${c.what}. Pull it and every task that needs ${c.tool} fails.`; }
  return PART_INFO[id].what; };
const chipName = (a, id) => id === 'HAT' ? 'HAT ' + HAT_INFO[a.hat][0].toLowerCase() : id === 'TOOL' ? 'TOOL ' + TOOL_INFO[a.tool][0].toLowerCase()
  : /^SK/.test(id) ? id + ' ' + a.cards[+id[2]-1].k.toLowerCase() : id + ' ' + PART_INFO[id].n.toLowerCase().replace('context ','').replace('main ','');

/* ---------- state ---------- */
const ST = { key:'base', placed:new Set(), wired:new Set(), drop:{}, headUp:false, headK:0, explode:false, exK:0, plug:true, plugK:1,
  link:null, linkK:0, run:null, done:null, fault:null, tokens:0, pal:'clay', labels:true, sel:null, wireQ:null, asmQ:null,
  yaw:DEF_YAW, pitch:DEF_PITCH, t:0, blink:0, rocket:0, log:[], partnerHappy:0 };
let AG = AGENTS[0];
const agentByKey = k => AGENTS.find(a => a.key === k);
const has = id => ST.placed.has(id);
const ok  = id => has(id) && (!WIRED.includes(id) || ST.wired.has(id));
const powered = () => ST.plug && ST.plugK > .97 && ok('PWR') && ok('BAT') && has('BRD');
const innerOpen = () => !has('HEAD') || ST.headUp || ST.explode || SHELL.some(p => !has(p));
const toolArm = () => AG.tool ? TOOL_INFO[AG.tool][2] : null;
const missing = () => partsOf(AG).filter(id => !has(id));
const unwired = () => WIRED.filter(id => has(id) && !ST.wired.has(id));

/* explode / lift / drop offsets */
const EX = { HEAD:[0,0,30], HAT:[0,0,46], FACE:[18,0,0], BACK:[-22,0,0], SIDEL:[0,20,0], SIDER:[0,-20,0], ARML:[0,30,4], ARMR:[0,-30,4],
  BRD:[0,0,10], U1:[0,0,22], M1:[0,0,18], M2:[0,0,18], BAT:[0,0,16], PWR:[0,0,15], J1:[0,0,15], SK1:[0,0,26], SK2:[0,0,26], SK3:[0,0,26], EYE:[8,0,8] };
function offOf(id){
  const k = ease(ST.exK), h = ease(ST.headK);
  let e = EX[id] || [0,0,0];
  if (id === 'TOOL') e = EX[toolArm()];
  const o = [e[0]*k, e[1]*k, e[2]*k];
  if (id === 'HEAD' || id === 'HAT') o[2] += 24*h*(1 - k*.6), o[1] += 6*h*(1 - k);
  const d = ST.drop[id]; if (d != null && d < 1) o[2] += (1 - ease(d)) * 30;
  return o;
}
const setXF = (o, base={s:1,x:0,y:0,z:Z0}) => { XF = { s:base.s, x:base.x + o[0], y:base.y + o[1], z:base.z + o[2] }; };

/* ---------- the body ---------- */
function frameItems(m){
  const out = [];
  for (const [x0,x1] of [[30,38],[2,10]]) for (const [y0,y1] of [[0,8],[14,22],[42,50],[56,64]]) out.push(ib(x0,y0,0, x1,y1,15, m, tone, 1.3));
  out.push(ib(0,0,15, 40,64,17, m, tone, 1.3));
  return out;
}
function expr(){
  if (ST.fault) return 'x';
  if (!powered() || !ok('EYE')) return 'closed';
  if (ST.run) return AG.tasks[ST.run.key].expr || AG.runExpr;
  if (ST.done && ST.t - ST.done.t < 2.4) return 'happy';
  if (ST.t % 4.2 < .13) return 'closed';
  return 'open';
}
const PART_DRAW = {
  SIDER: m => [it(BX(2,0,17, 38,2,49), wallBox(2,0,17, 38,2,49, m, [0,1,0]), 'SIDER')],

/* ---------- audio: a lofi loop and effects, all synthesised ---------- */
const AU = { ctx:null, music:false, fx:true, timer:null, next:0, step:0 };
function actx(){
  if (!AU.ctx){
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    const c = AU.ctx = new AC();
    AU.out = c.createDynamicsCompressor(); AU.out.connect(c.destination);
    AU.mus = c.createGain(); AU.mus.gain.value = 0;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900; lp.Q.value = .4;
    AU.mus.connect(lp); lp.connect(AU.out);
    AU.fxg = c.createGain(); AU.fxg.gain.value = .5; AU.fxg.connect(AU.out);
    const n = c.createBuffer(1, c.sampleRate, c.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; AU.noise = n;
    const cb = c.createBuffer(1, c.sampleRate*3, c.sampleRate), cd = cb.getChannelData(0);
    for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() < .0008 ? (Math.random()*2-1)*.8 : 0) + (Math.random()*2-1)*.01;
    AU.crackle = cb;
  }
  if (AU.ctx.state === 'suspended') AU.ctx.resume();
  return AU.ctx;
}
const mtof = m => 440 * Math.pow(2, (m - 69)/12);
function tn(t, freq, dur, vol, type='sine', dest=AU.fxg, glideTo=null){
  const c = AU.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
}
function nz(t, dur, vol, freq=2000, type='bandpass', dest=AU.fxg){
  const c = AU.ctx, s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
  s.buffer = AU.noise; fl.type = type; fl.frequency.value = freq; fl.Q.value = 1.2;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + .02);
}
function sfx(name){
  if (!AU.fx) return; const c = actx(); if (!c) return; const t = c.currentTime + .01;
  switch (name){
    case 'place':  tn(t, 880, .09, .25, 'triangle'); nz(t, .05, .25, 3200); break;
    case 'remove': tn(t, 520, .1, .2, 'triangle', AU.fxg, 300); break;
    case 'zip':    nz(t, .14, .28, 5200, 'highpass'); tn(t+.08, 1320, .06, .12, 'square'); break;
    case 'plug':   nz(t, .08, .5, 300, 'lowpass'); tn(t+.05, 660, .12, .2); tn(t+.16, 990, .2, .2); break;
    case 'unplug': nz(t, .07, .4, 400, 'lowpass'); tn(t+.03, 520, .14, .15, 'sine', AU.fxg, 260); break;
    case 'tick':   tn(t, 1760, .04, .06, 'square'); break;
    case 'run':    [0,1,2].forEach(i => tn(t + i*.07, mtof(72 + i*4), .12, .16, 'triangle')); break;
    case 'done':   [0,1,2,3].forEach(i => tn(t + i*.08, mtof(72 + [0,4,7,12][i]), .25, .18, 'triangle')); break;
    case 'fault':  tn(t, 110, .35, .22, 'square'); tn(t+.18, 92, .35, .2, 'square'); break;
    case 'launch': nz(t, 1.6, .35, 600, 'lowpass'); tn(t, 120, 1.4, .15, 'sawtooth', AU.fxg, 880); break;
    case 'ding':   tn(t, 2093, 1.2, .2); tn(t, 3136, .7, .08); break;
    case 'link':   tn(t, 660, .1, .18, 'triangle'); tn(t+.1, 880, .14, .18, 'triangle'); break;
    case 'open':   nz(t, .25, .2, 900, 'bandpass'); break;
    case 'blip':   tn(t, 1200, .05, .1, 'triangle'); break;
  }
}
const CHORDS = [[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]];
const PENTA = [72,74,76,79,81,84];
function schedule(){
  const c = AU.ctx, stepDur = 60/76/2;
  while (AU.next < c.currentTime + .25){
    const t = AU.next, s = AU.step % 32, ch = CHORDS[Math.floor(s/8)];
    if (s % 8 === 0){ ch.forEach((m, i) => { tn(t + i*.012, mtof(m), 2.9, .05, 'sine', AU.mus); tn(t + i*.012, mtof(m)*1.003, 2.2, .022, 'triangle', AU.mus); });
      tn(t, mtof(ch[0]-12), 1.4, .11, 'sine', AU.mus); }
    if (s % 8 === 0 || s % 8 === 5) tn(t, 62, .32, .32, 'sine', AU.mus, 40);
    if (s % 8 === 4) nz(t, .16, .1, 1700, 'bandpass', AU.mus);
    if (s % 2 === 1) nz(t, .04, .035, 7000, 'highpass', AU.mus);
    if (Math.random() < .22 && s % 2 === 0) tn(t, mtof(PENTA[Math.floor(Math.random()*PENTA.length)]), .5, .03, 'sine', AU.mus);
    AU.next += stepDur; AU.step++;
  }
}
function setMusic(on){
  AU.music = on; const c = actx(); if (!c) return;
  AU.mus.gain.cancelScheduledValues(c.currentTime); AU.mus.gain.linearRampToValueAtTime(on ? .9 : 0, c.currentTime + .6);
  if (on && !AU.timer){ AU.next = c.currentTime + .1; AU.timer = setInterval(schedule, 60);
    const cr = c.createBufferSource(); cr.buffer = AU.crackle; cr.loop = true; cr.connect(AU.mus); cr.start(); AU.cr = cr; }
  if (!on && AU.timer){ setTimeout(() => { if (!AU.music){ clearInterval(AU.timer); AU.timer = null; try { AU.cr.stop(); } catch(e){} } }, 700); }
}

/* ---------- log ---------- */
function logLn(txt, cls=''){ ST.log.push([txt, cls]); if (ST.log.length > 40) ST.log.shift(); renderLog(); }
function renderLog(){ const el = document.getElementById('term'); if (!el) return;
  el.innerHTML = ['-- agent log --', ...[]].map(t => esc(t)).join('') + '\n' + ST.log.map(([t, c]) => c ? `<span class="${c}">${esc(t)}</span>` : esc(t)).join('\n');
  el.scrollTop = el.scrollHeight; }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- flash notice ---------- */
let flashT = null;
function flash(msg, ms=2600){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(flashT); flashT = setTimeout(() => el.classList.remove('show'), ms); }

/* ---------- rules ---------- */
function canPlace(id){
  if (has(id)) return { ok:true };
  if (ON_BOARD.includes(id) && !has('BRD')) return { ok:false, why:'Place BRD, the main board, first' };
  if (INNER.includes(id) && !innerOpen()) return { ok:false, why:'Lift the head first: it is inside' };
  if (id === 'HEAD' && SHELL.some(p => !has(p))) return { ok:false, why:'The head sits on the four panels: put them on first' };
  if (id === 'HAT' && !has('HEAD')) return { ok:false, why:'No head to put the hat on' };
  if (id === 'TOOL' && !has(toolArm())) return { ok:false, why:`No ${toolArm() === 'ARML' ? 'left' : 'right'} arm to hold it` };
  return { ok:true };
}
function canRemove(id){
  if (!has(id)) return { ok:true };
  if (id === 'BRD'){ const on = ON_BOARD.filter(has); if (on.length) return { ok:false, why:`Pull ${on.slice(0,3).join(', ')}${on.length > 3 ? '…' : ''} off the board first` }; }
  if (INNER.includes(id) && !innerOpen()) return { ok:false, why:'Lift the head first: it is inside' };
  if (SHELL.includes(id) && has('HEAD') && !ST.headUp && !ST.explode) return { ok:false, why:'The head holds the panels: lift it first' };
  if (id === 'HEAD' && has('HAT')) return { ok:false, why:'Take the hat off first' };
  if (id === toolArm() && has('TOOL')) return { ok:false, why:`Put the ${TOOL_INFO[AG.tool][0].toLowerCase()} down first` };
  return { ok:true };
}
function place(id, quiet){
  const c = canPlace(id); if (!c.ok){ flash(c.why); sfx('fault'); return false; }
  if (has(id)) return true;
  ST.placed.add(id); ST.drop[id] = 0; ST.fault = null;
  if (!quiet){ sfx('place'); logLn(`+ ${id} ${partName(AG, id).toLowerCase()}${WIRED.includes(id) ? ' (not connected)' : ''}`, 'd'); }
  if (id === 'HEAD') ST.headUp = false;
  kick(); return true;
}
function removePart(id){
  const c = canRemove(id); if (!c.ok){ flash(c.why); sfx('fault'); return false; }
  ST.placed.delete(id); ST.wired.delete(id); delete ST.drop[id];
  if (id === 'HEAD') ST.headUp = false;
  if (id === 'PWR' && ST.plug){ ST.plug = false; logLn('power cable fell out', 'w'); }
  if (id === 'J1' && ST.link){ ST.link = null; ST.linkK = 0; logLn('link cable unplugged', 'w'); }
  sfx('remove'); logLn(`- ${id} ${partName(AG, id).toLowerCase()}`, 'd');
  checkRun(); kick(); return true;
}
function togglePart(id){ return has(id) ? removePart(id) : place(id); }

/* ---------- running ---------- */
function needs(task){
  if (!powered()) return { msg:'No power: plug in the cable' };
  if (!ok('U1')) return { id:'U1', msg:has('U1') ? 'U1 llm core is not connected' : 'No model: place U1, the llm core' };
  if (!ok('M1') && !ok('M2')) return { id:'M1', msg:'Context window empty: slot M1 or M2' };
  const card = 'SK' + (task.card + 1), cd = AG.cards[task.card];
  if (!ok(card)) return { id:card, msg:`Task needs ${card} ${cd.k} (${cd.tool})${has(card) ? ': connect it' : ''}` };
  return null;
}
function startRun(key){
  const task = AG.tasks[key], n = needs(task);
  ST.done = null;
  if (n){ fault(n); return; }
  ST.fault = null; ST.run = { key, t:0, li:0 }; ST.tokens = 0; ST.rocket = 0;
  sfx('run'); kick();
}
function fault(n){ ST.fault = n; ST.run = null; flash(n.msg); logLn('! ' + n.msg, 'e'); sfx('fault'); kick(); }
function checkRun(){ if (!ST.run) return; const n = needs(AG.tasks[ST.run.key]); if (n) fault(n); }
const ramSticks = () => (ok('M1') ? 1 : 0) + (ok('M2') ? 1 : 0);
function tickRun(dt){
  const r = ST.run; if (!r) return;
  const task = AG.tasks[r.key], N = task.log.length, step = .75;
  r.t += dt;
  ST.tokens = Math.min(task.tok, ST.tokens + task.tok/(N*step) * dt);
  const ctxMax = ramSticks() * 100000;
  if (ctxMax && ST.tokens / ctxMax > .98 && !r.warned){ r.warned = true; logLn('context full: compacting', 'w'); }
  while (r.li < N && r.t >= r.li*step){ logLn(task.log[r.li], r.li === 0 ? 'd' : ''); r.li++; sfx('tick'); }
  if (task.rocket && r.t > (N-1)*step){ const k = r.t - (N-1)*step; ST.rocket = 4*k*k*12; if (k < .05 && !r.launched){ r.launched = true; sfx('launch'); } }
  if (AG.prop === 'bell' && (ST.t % 1.6) < dt) sfx('ding');
  if (r.t >= N*step + .9){
    logLn(task.out, 'd');
    if (ST.link){ const p = agentByKey(ST.link); logLn(`handoff -> ${p.name.toLowerCase()} via MCP: ${r.key}.md`, 'w'); ST.partnerHappy = ST.t + 3; sfx('link'); }
    ST.done = { key:r.key, t:ST.t }; ST.run = null; ST.tokens = task.tok; sfx('done');
    if (task.rocket) setTimeout(() => { ST.rocket = 0; kick(); }, 1400);
  }
}

/* ---------- bench actions ---------- */
function strip(){
  ST.placed.clear(); ST.wired.clear(); ST.drop = {}; ST.plug = false; ST.plugK = 0; ST.link = null; ST.linkK = 0; ST.run = null; ST.fault = null;
  ST.headUp = false; ST.headK = 0; ST.explode = false; ST.wireQ = null; ST.asmQ = null; ST.rocket = 0; ST.sel = null;
  sfx('open'); logLn('stripped to the frame: legs and floor', 'w'); flash('Bare frame: legs and floor only'); kick();
}
function assemble(){
  const q = missing(); if (!q.length){ flash('Everything is already in'); return; }
  ST.headUp = true; ST.asmQ = { list:q, t:.12 }; logLn(`auto-assemble: ${q.length} parts`, 'd'); kick();
}
function connect(){
  const q = unwired();
  if (!q.length){ flash(ST.placed.size ? 'Everything is connected' : 'Nothing to connect: place parts first'); return; }
  ST.wireQ = { list:q.slice(), cur:q[0], t:0 }; logLn(`connecting ${q.length} parts`, 'd'); kick();
}
function liftHead(){
  if (!has('HEAD')){ flash('No head on: place HEAD'); return; }
  ST.headUp = !ST.headUp; sfx('open'); logLn(ST.headUp ? 'head lifted: the board is open' : 'head back on', 'd'); kick();
}
function plugToggle(){
  if (!ST.plug){
    if (!has('PWR')){ flash("There's nothing to plug into: place PWR first"); sfx('fault'); return; }
    ST.plug = true; sfx('plug'); logLn('-- power on --', 'd');
    setTimeout(() => { if (!ST.plug) return;
      if (!powered()){ const m = !has('BAT') ? 'No power cell: place BAT' : !ok('BAT') || !ok('PWR') ? 'Plugged in, but PWR and BAT are not connected' : 'No power'; flash(m); logLn('! ' + m, 'e'); }
      else { flash(ok('EYE') && has('FACE') ? 'Powered: the eyes come on' : 'Powered'); }
      kick(); }, 650);
  } else { ST.plug = false; ST.run = null; ST.fault = null; sfx('unplug'); logLn('-- power off --', 'd'); }
  kick();
}
function linkTo(key){
  if (key === null){ ST.link = null; ST.linkK = 0; logLn('unlinked', 'd'); kick(); return; }
  if (!has('J1')){ flash('No MCP port: place J1 first'); sfx('fault'); return; }
  ST.link = key; ST.linkK = 0; sfx('link'); logLn(`linked to ${agentByKey(key).name.toLowerCase()} over MCP`, 'd');
  if (!ok('J1')) flash('Linked, but J1 is not connected yet');
  kick();
}
function explodeToggle(){ ST.explode = !ST.explode; sfx('open'); kick(); }

const BUTTONS = () => [
  { label:'Strip to bare frame', do:strip },
  { label:'Auto-assemble', do:assemble },
  { label:'Place a part', choices:() => partsOf(AG).map(id => { const c = has(id) ? canRemove(id) : canPlace(id);
      return { label:chipName(AG, id), current:has(id), disabled:!c.ok, why:c.why, do:() => togglePart(id) }; }) },
  { label:'Connect parts', do:connect },
  { label:ST.headUp ? 'Put the head back' : 'Lift the head', do:liftHead, pressed:ST.headUp },
  { label:'Plug / unplug power', do:plugToggle, pressed:ST.plug },
  { label:'Run task', choices:() => Object.entries(AG.tasks).map(([k, t]) => ({ label:t.title, current:ST.run && ST.run.key === k, disabled:!powered(), why:'Plug in first', do:() => startRun(k) })) },
  { label:'Link agent', choices:() => [...AGENTS.filter(a => a.key !== AG.key).map(a => ({ label:a.short.toLowerCase(), current:ST.link === a.key, disabled:!has('J1'), why:'Place J1 MCP port first', do:() => linkTo(a.key) })),
      ...(ST.link ? [{ label:'unlink', do:() => linkTo(null) }] : [])] },
  { label:ST.explode ? 'Close up' : 'Exploded view', do:explodeToggle, pressed:ST.explode },
];
let openWrap = null;
function renderActions(){
  const el = document.getElementById('btns'), keep = openWrap;
  el.innerHTML = '<div class="cap">Bench</div>';
  BUTTONS().forEach((b, i) => {
    const w = document.createElement('div'); w.className = 'stepwrap';
    const btn = document.createElement('button'); btn.className = 'act'; btn.innerHTML = esc(b.label) + (b.choices ? '<span class="car">▾</span>' : '');
    if (b.pressed) btn.setAttribute('aria-pressed', 'true');
    w.appendChild(btn);
    if (b.choices){
      const ch = document.createElement('div'); ch.className = 'chips';
      b.choices().forEach((c, j) => { const x = document.createElement('button'); x.className = 'chip' + (c.current ? ' current' : '') + (c.disabled ? ' off' : ''); x.textContent = c.label;
        x.onclick = e => { e.stopPropagation(); actx(); const cc = BUTTONS()[i].choices()[j] || c; if (cc.disabled){ flash(cc.why); sfx('fault'); return; } cc.do(); openWrap = i; renderActions(); };
        ch.appendChild(x); });
      w.appendChild(ch);
      btn.onclick = e => { e.stopPropagation(); actx(); openWrap = w.classList.contains('open') ? null : i; renderActions(); };
      if (keep === i) w.classList.add('open');
    } else btn.onclick = () => { actx(); document.querySelectorAll('.stepwrap.open').forEach(n => n.classList.remove('open')); openWrap = null; b.do(); renderActions(); };
    el.appendChild(w);
  });
}
document.addEventListener('click', () => { document.querySelectorAll('.stepwrap.open').forEach(n => n.classList.remove('open')); openWrap = null; });

/* ---------- stats ---------- */
function statusText(){
  if (ST.fault) return 'FAULT';
  if (ST.run) return 'RUNNING';
  if (!ST.placed.size) return 'BARE FRAME';
  if (missing().length) return 'ASSEMBLING';
  if (unwired().length) return 'NEEDS WIRING';
  if (powered()) return ST.done && ST.t - ST.done.t < 4 ? 'DONE' : 'IDLE';
  return 'READY';
}
let lastStats = '';
function renderStats(){
  const all = partsOf(AG).length, S2 = [{ k:'Parts', v:`${ST.placed.size}/${all}` }, { k:'Status', v:statusText(), small:true }];
  const uw = unwired().length;

  else if (uw && ST.placed.size) S2.push({ k:'To connect', v:uw, small:true });

  if (html !== lastStats){ const el = document.getElementById('stats'); const prev = lastStats; el.innerHTML = html; lastStats = html;

}

function renderSide(){

  for (const a of AGENTS){ if (a.group !== g){ g = a.group; html += `<div class="grp">${g}</div>`; }
    html += `<a href="#${a.key}" aria-current="${a.key === AG.key}"><em>Fig. ${a.fig}</em>${esc(a.name)}<span>${esc(a.sub)}</span></a>`; }
  html += `<small>Every agent is the same body. The cards and the file make the job.<br><br>Drawn with <a href="https://april-zhu.com/colorfigures" target="_blank" rel="noopener">Colorfigures</a> (MIT).</small>`;
  document.getElementById('side').innerHTML = html;
}

/* ---------- loop ---------- */
let raf = null, lastT = 0, dirty = true;
const kick = () => { dirty = true; if (!raf) raf = requestAnimationFrame(frameLoop); };
function animating(){
  return ST.run || ST.wireQ || ST.asmQ || Object.values(ST.drop).some(d => d < 1) || Math.abs(ST.headK - (ST.headUp ? 1 : 0)) > .001
    || Math.abs(ST.exK - (ST.explode ? 1 : 0)) > .001 || Math.abs(ST.plugK - (ST.plug ? 1 : 0)) > .001 || (ST.link && ST.linkK < 1)
    || ST.rocket > 0 || (ST.done && ST.t - ST.done.t < 4.2) || ST.partnerHappy > ST.t || (powered() && (AG.tool === 'mug' || AG.prop === 'laptop'));
}
const approach = (v, target, dt, speed) => v < target ? Math.min(target, v + dt*speed) : Math.max(target, v - dt*speed);
function frameLoop(now){
  raf = null;
  const dt = Math.min(.05, lastT ? (now - lastT)/1000 : .016); lastT = now;
  ST.t += dt;
  for (const k in ST.drop) if (ST.drop[k] < 1) ST.drop[k] = Math.min(1, ST.drop[k] + dt/.38);
  ST.headK = approach(ST.headK, ST.headUp ? 1 : 0, dt, 2.2);
  ST.exK = approach(ST.exK, ST.explode ? 1 : 0, dt, 1.6);
  ST.plugK = approach(ST.plugK, ST.plug ? 1 : 0, dt, 1.8);
  if (ST.link) ST.linkK = approach(ST.linkK, 1, dt, 1.2);
  if (ST.asmQ){ ST.asmQ.t += dt; while (ST.asmQ && ST.asmQ.t >= .14){ ST.asmQ.t -= .14; const id = ST.asmQ.list.shift(); place(id, true); sfx('place');
      if (!ST.asmQ.list.length){ ST.asmQ = null; ST.headUp = false; logLn('assembled: now connect the parts', 'd'); flash('Assembled. Now connect the parts'); renderActions(); } } }
  if (ST.wireQ){ const w = ST.wireQ; w.t += dt; if (w.t >= .32){ ST.wired.add(w.cur); sfx('zip'); w.list.shift(); w.t = 0; w.cur = w.list[0];
      if (!w.cur){ ST.wireQ = null; logLn('all connected', 'd'); flash(ST.plug ? 'Connected' : 'Connected. Plug in the power'); renderActions(); } } }
  tickRun(dt);
  if (dirty || animating() || (powered() && ST.t % 4.2 < .2)){ render(); dirty = false; }
  if (animating() || powered()) raf = requestAnimationFrame(frameLoop);
  else if (dirty) raf = requestAnimationFrame(frameLoop);
}
let lastHash = '';
function render(){
  const svg = document.getElementById('fig');
  svg.innerHTML = drawSvg();
  const wob = document.getElementById('wob'); if (wob) wob.setAttribute('scale', (2.4*INK_K*WOBBLE).toFixed(2));
  renderStats();
  const h = (ST.sel || '') + [...ST.placed].join() + [...ST.wired].join();
  if (h !== lastHash){ lastHash = h; renderPartPanel(); }
  window.__st = ST;
}
let WOBBLE = 1;

/* ---------- agent switching ---------- */
function loadAgent(key, opts={}){
  AG = agentByKey(key) || AGENTS[0];
  ST.key = AG.key; ST.placed = new Set(partsOf(AG)); ST.wired = new Set(WIRED); ST.drop = {}; ST.headUp = false; ST.headK = 0; ST.explode = false; ST.exK = 0;
  ST.plug = true; ST.plugK = 1; ST.link = null; ST.linkK = 0; ST.run = null; ST.done = null; ST.fault = null; ST.tokens = 0; ST.sel = null; ST.wireQ = null; ST.asmQ = null; ST.rocket = 0;
  ST.log = [];
  logLn('-- power on --', 'd'); logLn(`${AG.file}: loaded`, ''); logLn(`cards: ${AG.cards.map(c => c.k.toLowerCase()).join(' · ')}`, '');
  document.title = `${AG.name} · Agent Bench`;
  document.getElementById('title').textContent = `Fig. ${AG.fig} — ${AG.name}`;
  document.getElementById('hint').textContent = AG.hint;
  renderSide(); renderActions(); renderLesson(); lastStats = ''; kick();
}

/* ---------- page ---------- */
function mountBench(){
  const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
  document.body.innerHTML = `<nav class="side" id="side"></nav>
  <main class="page">
    <header><h2 id="title"></h2><span id="hint"></span></header>
    <div class="stage"><div class="actions" id="actions"><div id="btns" style="display:contents"></div><div class="toast" id="toast"></div></div><div class="stats" id="stats"></div>
      <svg id="fig" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent figure"></svg></div>
    <div class="controls">
      <div class="ctl"><label for="wob">Hand-drawn wobble</label><input id="wobr" type="range" min="0" max="3" step=".1" value="1"></div>
      <div class="ctl"><label>Colour</label><div class="row" id="sw"></div></div>
      <div class="ctl"><label>Labels</label><div class="row"><button class="tg" id="lbl" aria-pressed="true">On</button></div></div>
      <div class="ctl"><label>Sound</label><div class="row"><button class="tg" id="lofi" aria-pressed="false">Lofi<span class="eq"><i></i><i></i><i></i></span></button><button class="tg" id="fx" aria-pressed="true">Effects</button></div></div>
    </div>
    <div class="lesson">
      <div>
        <section><h3>Meet the agent</h3><div id="meet"></div></section>
        <section><div class="card" id="selpart"></div></section>
        <section><h3>Parts on this agent</h3><ul class="plist" id="plist"></ul></section>
      </div>
      <div>
        <section><div class="codehead"><h3 id="codehd"></h3><button id="copy">Copy</button></div><pre class="code" id="code"></pre></section>
        <section><h3>Agent log</h3><div class="term" id="term"></div></section>
      </div>
      <section class="full"><h3>Check yourself</h3><div id="quiz"></div></section>
      <section class="full"><h3>Practice task</h3><p id="practice"></p></section>
    </div>
    <div class="made-with"><span>Agent Bench · characters are pixel sprites rebuilt in 3D</span><a href="https://april-zhu.com/colorfigures" target="_blank" rel="noopener">Made with Colorfigures ↗</a></div>
  </main>`;
  frame();
  const svg = document.getElementById('fig'); svg.setAttribute('viewBox', VB.map(v => v.toFixed(1)).join(' '));
  // colour swatches
  const sw = document.getElementById('sw');
  Object.keys(PALS).forEach(k => { const b = document.createElement('button'); b.className = 'sw'; b.title = k; b.style.background = PALS[k].l; b.setAttribute('aria-pressed', k === ST.pal);
    b.onclick = () => { ST.pal = k; sw.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === b)); kick(); }; sw.appendChild(b); });
  document.getElementById('wobr').oninput = e => { WOBBLE = +e.target.value; kick(); };
  const lbl = document.getElementById('lbl');
  lbl.onclick = () => { ST.labels = !ST.labels; lbl.setAttribute('aria-pressed', ST.labels); lbl.textContent = ST.labels ? 'On' : 'Off'; kick(); };
  const lofi = document.getElementById('lofi'), fx = document.getElementById('fx');
  lofi.onclick = () => { setMusic(!AU.music); lofi.setAttribute('aria-pressed', AU.music); };
  fx.onclick = () => { AU.fx = !AU.fx; fx.setAttribute('aria-pressed', AU.fx); };
  document.getElementById('copy').onclick = () => { try { navigator.clipboard.writeText(AG.md); flash('Copied ' + AG.file); } catch(e){} };
  // drag to turn, click to select
  let drag = null;
  svg.addEventListener('pointerdown', e => { drag = { x:e.clientX, y:e.clientY, yaw:ST.yaw, pitch:ST.pitch, moved:false }; });
  addEventListener('pointermove', e => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4){ drag.moved = true; svg.classList.add('drag'); try { svg.setPointerCapture(e.pointerId); } catch(_){} }
    if (drag.moved){ ST.yaw = drag.yaw - dx*.45; ST.pitch = Math.max(8, Math.min(70, drag.pitch + dy*.3)); kick(); } });
  addEventListener('pointerup', e => { if (!drag) return; svg.classList.remove('drag');
    if (!drag.moved){ const g = e.target.closest && e.target.closest('[data-id]'); ST.sel = g ? (ST.sel === g.dataset.id ? null : g.dataset.id) : null; if (g) sfx('blip'); renderPartPanel(); kick(); }
    drag = null; });
  svg.addEventListener('dblclick', () => { ST.yaw = DEF_YAW; ST.pitch = DEF_PITCH; kick(); });
  addEventListener('keydown', e => { if (e.target.closest('input,textarea')) return;
    if (e.key === 'ArrowLeft'){ ST.yaw += 15; kick(); } if (e.key === 'ArrowRight'){ ST.yaw -= 15; kick(); } });
  addEventListener('hashchange', () => loadAgent(location.hash.slice(1)));
  const q = new URLSearchParams(location.search);
  loadAgent(q.get('fig') || location.hash.slice(1) || 'base');
  params(q);
}
// URL states for screenshots: ?fig=seo&yaw=..&pitch=..&head=up&explode=1&strip=1&loose=SK2,U1&unwired=1&plug=0&run=audit&t=2&link=content&sel=U1
function params(q){
  if (q.has('yaw')) ST.yaw = +q.get('yaw'); if (q.has('pitch')) ST.pitch = +q.get('pitch');
  if (q.get('strip') === '1'){ ST.placed.clear(); ST.wired.clear(); ST.plug = false; ST.plugK = 0; }
  if (q.has('loose')) q.get('loose').split(',').forEach(id => { ST.placed.delete(id); ST.wired.delete(id); });
  if (q.get('unwired') === '1') ST.wired.clear();
  if (q.get('head') === 'up'){ ST.headUp = true; ST.headK = 1; }
  if (q.get('explode') === '1'){ ST.explode = true; ST.exK = 1; }
  if (q.get('plug') === '0'){ ST.plug = false; ST.plugK = 0; }
  if (q.has('link')){ ST.link = q.get('link'); ST.linkK = 1; }
  if (q.has('sel')) ST.sel = q.get('sel');
  if (q.get('labels') === '0') ST.labels = false;
  if (q.has('pal')) ST.pal = q.get('pal');
  if (q.has('run')){ startRun(q.get('run')); const T = +(q.get('t') || 2); for (let s = 0; s < T; s += .05){ ST.t += .05; tickRun(.05); } }
  if (q.has('time')) ST.t = +q.get('time');
  renderActions(); kick();
}

mountBench();
</script>
</body>
</html>
